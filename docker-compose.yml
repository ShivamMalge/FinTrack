services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_tracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fintrack-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/finance_tracker"
      JWT_SECRET: "docker_compose_secret_change_in_production"
      JWT_EXPIRES_IN: "15m"
      PORT: "4001"
      FRONTEND_ORIGIN: "http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fintrack-net

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - fintrack-net

volumes:
  pgdata:

networks:
  fintrack-net:
    driver: bridge
